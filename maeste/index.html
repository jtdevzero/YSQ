<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#151716">
  <meta name="description" content="Nyisd meg a MaEste film- és sorozatválasztó alkalmazást, egyedül vagy párosan.">
  <meta http-equiv="refresh" content="0; url=https://maeste-filmrandi.turcsi.chatgpt.site">
  <title>MaEste – App megnyitása</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f3efe3; background: #151716; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 30px 20px; }
    main { width: 100%; max-width: 560px; padding: clamp(26px, 6vw, 48px); border: 1px solid #42483d; border-radius: 18px; background: #1b1e1c; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 26px; font-weight: 750; letter-spacing: -1px; }
    .symbol { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; background: #e6b875; color: #151716; font-family: Georgia, serif; font-size: 29px; font-weight: bold; }
    .dot { color: #e6b875; }
    .eyebrow { margin: 38px 0 13px; color: #bdc8a5; font-size: 11px; font-weight: 650; letter-spacing: 1.6px; }
    h1 { margin: 0 0 19px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(35px, 8vw, 48px); font-weight: 400; letter-spacing: -1.3px; line-height: 1.12; }
    p { margin: 0; color: #c4c9ba; font-size: 15px; line-height: 1.8; }
    .launch { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-top: 29px; padding: 16px 19px; border: 2px solid #e6b875; border-radius: 8px; background: #e6b875; color: #151716; font-size: 15px; font-weight: 750; text-decoration: none; }
    .launch:hover { background: #f0c98f; border-color: #f0c98f; }
    .launch:focus-visible { outline: 3px solid #f3efe3; outline-offset: 5px; }
    .launch span { font-size: 21px; }
    .fallback { margin-top: 16px; color: #aeb7a1; font-size: 12px; }
    .closing { margin-top: 31px; padding-top: 20px; border-top: 1px solid #42483d; color: #bdc8a5; font-family: Georgia, "Times New Roman", serif; font-size: 15px; font-style: italic; }
  </style>
</head>
<body>
  <main aria-labelledby="launch-title">
    <div class="brand"><span class="symbol" aria-hidden="true">m</span><span>MaEste<span class="dot">.</span></span></div>
    <p class="eyebrow">FILMEK ÉS SOROZATOK · EGYÜTT VAGY EGYEDÜL</p>
    <h1 id="launch-title">Mindjárt kezdődik.</h1>
    <p>Ez az oldal automatikusan átirányít a működő MaEste alkalmazáshoz.</p>
    <a class="launch" href="https://maeste-filmrandi.turcsi.chatgpt.site">MaEste megnyitása <span aria-hidden="true">↗</span></a>
    <p class="fallback">Ha az átirányítás nem indul el, a fenti gombbal megnyithatod az appot.</p>
    <p class="closing">Egy jó történet. Együtt.</p>
  </main>
</body>
</html>
